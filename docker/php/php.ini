memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
expose_php = Off
; Business dates are interpreted in Asia/Almaty by the application; PHP itself stays on UTC.
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
