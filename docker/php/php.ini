memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
expose_php = Off
; Errors go to the log (stderr of the container), never into a page: the application renders its own error pages.
display_errors = Off
display_startup_errors = Off
log_errors = On
; Business dates are interpreted in Asia/Almaty by the application; PHP itself stays on UTC.
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
