# CI (ERP-012, ТЗ ENV-03): the same commands a developer runs, on a clean machine with Docker only.
# `make setup` creates .env with generated secrets, builds the pinned images, installs dependencies from the lock files,
# migrates and seeds synthetic data; `make check` runs style, types, production build, backend tests on PostgreSQL and the
# connection check; then an HTTP smoke through nginx and the harness self-tests. A failing step fails the run (exit code).
# No secrets are used, and only test reports and logs are uploaded (never .env).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (Docker, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup — images, dependencies from lock files, .env, migrations, synthetic seed
        run: make setup

      - name: make check — pint, types, build, backend tests, PostgreSQL connections
        env:
          JUNIT: storage/logs/junit.xml
        run: make check

      - name: HTTP smoke through nginx
        run: scripts/check.sh http

      - name: Harness self-tests
        run: make harness-selftest

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --timestamps --tail=300 > storage/logs/compose.log 2>&1 || true

      - name: Upload test report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ github.run_id }}
          path: |
            storage/logs/junit.xml
            storage/logs/compose.log
          retention-days: 90
          if-no-files-found: ignore
